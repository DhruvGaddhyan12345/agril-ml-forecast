[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agriml"
version = "0.1.0"
description = "A practical, leakage-safe agricultural ML reference project"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "scipy>=1.14,<2",
  "pyyaml>=6,<7",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.16,<4"]
monitoring = ["evidently>=0.4.40,<1"]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]
full = ["mlflow>=2.16,<4", "evidently>=0.4.40,<1", "xgboost>=2.1,<3", "lightgbm>=4.5,<5", "torch>=2.5,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
