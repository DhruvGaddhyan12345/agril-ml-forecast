name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
            python-version: "3.11"
          - run: pip install -e ".[dev,full]"
      - run: pytest
      - run: python scripts/run_full_pipeline.py
          - run: docker build -t agriml:test .
